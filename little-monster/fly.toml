# fly.toml app configuration file generated for little-monster on 2025-09-22T16:48:59+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'little-monster'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/app.db'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1