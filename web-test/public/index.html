<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Little Monster — Realtime Lesson Tester</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #0b0c10;
        --fg: #eaf0f6;
        --card: #12131a;
        --line: #1a1e27;
        --muted: #a8b3c7;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Inter, Helvetica, Arial;
        background: var(--bg);
        color: var(--fg);
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .row > * {
        flex: 1 1 260px;
      }
      textarea,
      input,
      select,
      button {
        font: inherit;
      }
      textarea,
      input[type="number"],
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #2a2d3a;
        background: #0e0f15;
        color: var(--fg);
      }
      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #2a2d3a;
        background: #0e0f15;
        color: var(--fg);
      }
      button {
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid #3a3f55;
        background: #1a1e2b;
        color: var(--fg);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .pill {
        display: inline-block;
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid #3a3f55;
        background: #0e0f15;
      }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #0e0f15;
        border: 1px solid #2a2d3a;
        border-radius: 12px;
        padding: 12px;
        height: 240px;
        overflow: auto;
        white-space: pre-wrap;
      }
      label {
        font-size: 12px;
        display: block;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>🧪 Little Monster — Realtime Lesson Tester</h1>
        <p class="muted">
          No Meet/Zoom. Browser ↔ OpenAI Realtime (WebRTC). Full lesson flow
          using OpenAI for speech + ASR.
        </p>

        <div class="row">
          <div>
            <label>Durations (sec): Vocab / Speaking / Conversation</label>
            <div class="row" style="margin: 0">
              <input id="vocabS" type="number" value="60" min="10" />
              <input id="speakS" type="number" value="60" min="10" />
              <input id="convS" type="number" value="60" min="10" />
            </div>
          </div>
          <div>
            <label>Skip / Intro only</label>
            <div class="row" style="margin: 0">
              <label><input id="skipIntro" type="checkbox" /> Skip intro</label>
              <label><input id="introOnly" type="checkbox" /> Intro only</label>
            </div>
          </div>
          <div>
            <label>Transcription language</label>
            <select id="lang">
              <option value="en" selected>English (en)</option>
              <option value="ja">Japanese (ja)</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div style="flex: 2">
            <label>Lesson JSON</label>
            <textarea id="lesson" rows="18"></textarea>
            <div class="row" style="margin-top: 8px">
              <button id="loadSample">Load Sample</button>
              <button id="formatJson">Format JSON</button>
            </div>
          </div>
          <div style="flex: 1">
            <label>Controls</label>
            <div class="row" style="margin: 0">
              <button id="connect">Connect Mic</button>
              <button id="start" disabled>Start Lesson</button>
              <button id="stop" disabled>Stop</button>
            </div>
            <div class="row" style="margin-top: 10px">
              <span class="pill" id="status">status: idle</span>
              <span class="pill" id="armed">mic: disarmed</span>
              <span class="pill" id="speak">tts: idle</span>
            </div>
          </div>
        </div>

        <h3 style="margin: 16px 0 8px">Console</h3>
        <div id="log" class="log"></div>
        <p class="muted" style="margin-top: 8px">
          Tip: If you don’t hear audio, ensure the page has speaker permission
          and the tab is active.
        </p>
      </div>
    </div>

    <script type="module">
      import {
        prepareMic,
        createTransport,
        attachPcDebugHandlers,
      } from "/js/webrtc.js";
      import { createRealtimeApi } from "/js/realtime.js";
      import { makeRunVocab } from "/js/lessons/vocab.js";
      import { makeRunSpeaking } from "/js/lessons/speaking.js";
      import { makeRunConversation } from "/js/lessons/conversation.js";

      // --- constants / policy (unchanged) ---
      const BASE_EN_POLICY = [
        "LANGUAGE POLICY:",
        "• Speak in **English** for all narration, instructions, scaffolding, and prompts.",
        "• Use **Japanese only** when quoting the lesson’s `jp` strings (vocabulary items or jp example lines).",
        "• Do **not** answer in Spanish or any language other than English unless you are quoting a `jp` string.",
        "",
        "BEHAVIOR:",
        "• Keep each turn under 8 seconds.",
        "• Do not invent content; stick to the lesson data.",
      ].join("\\n");

      // --- UI helpers (unchanged) ---
      const $ = (s) => document.querySelector(s);
      const statusEl = $("#status"),
        armedEl = $("#armed"),
        speakEl = $("#speak"),
        logEl = $("#log");
      const log = (...a) => {
        const line = a
          .map((x) => (typeof x === "string" ? x : JSON.stringify(x)))
          .join(" ");
        console.log(line);
        logEl.textContent += line + "\\n";
        logEl.scrollTop = logEl.scrollHeight;
      };

      // --- Realtime wiring state ---
      let mic = null;
      let audioEl = null;
      let transport = null;

      const realtime = createRealtimeApi({
        log,
        onSpeakStateChange: (speaking) => {
          speakEl.textContent = speaking ? "tts: speaking" : "tts: idle";
        },
      });

      const runVocab = makeRunVocab({ realtime, log });
      const runSpeaking = makeRunSpeaking({ realtime, log });
      const runConversation = makeRunConversation({ realtime, log });

      // Keep a tiny helper to set VAD pill + log (actual VAD update is inside realtime.setArmed)
      function setArmedPill(on) {
        armedEl.textContent = on ? "mic: ARMED" : "mic: disarmed";
        log(on ? "[RTC] ARMED" : "[RTC] DISARMED");
      }

      // --- Lesson helpers (identical logic) ---
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      function prettyFocus(lesson) {
        const raw = String(lesson?.lesson?.focus || "")
          .trim()
          .toLowerCase();
        const map = {
          intro: "polite phone introductions (keigo)",
          keigo: "polite Japanese (keigo)",
          calls: "keigo for customer calls",
        };
        if (map[raw]) return map[raw];
        if (raw)
          return raw
            .replace(/[_-]+/g, " ")
            .replace(/\\b\\w/g, (c) => c.toUpperCase());
        const notes = (lesson?.lesson?.notes || "").trim();
        return notes || "today’s objectives";
      }

      async function runKickoff(lesson, durs) {
        realtime.updateInstructions(
          [
            "ROLE: Polite Japanese instructor for telephone keigo.",
            "SYSTEM: Kickoff is a scripted monologue.",
            "- Do NOT ask questions.",
            "- Speak only when a response is created.",
            "Keep each utterance under 8 seconds.",
          ].join("\\n")
        );
        const mins = (ms) => Math.round(ms / 60000);
        const line = [
          "Hello and welcome to today's lesson.",
          `Our focus is ${prettyFocus(lesson)}.`,
          `We'll spend about ${mins(durs.vocabMs)} minutes on vocabulary,`,
          `${mins(durs.speakingMs)} on speaking practice,`,
          `and ${mins(durs.conversationMs)} on a short conversation.`,
          "Let's begin shortly.",
        ].join(" ");
        await realtime.speakOnceAndWait(
          `Speak exactly this line and nothing else: "${line}"`
        );
        await sleep(300);
      }

      async function runLesson(lesson, opts) {
        const durations = {
          vocabMs: (opts.vocabS ?? 60) * 1000,
          speakingMs: (opts.speakingS ?? 60) * 1000,
          conversationMs: (opts.conversationS ?? 60) * 1000,
          wrapMs: 6000,
        };

        if (!opts.skipIntro) {
          await runKickoff(lesson, durations);
          if (opts.introOnly) return;
        } else {
          log("[orchestrator] SKIP_INTRO=true → jumping straight to units");
        }

        const plan = [
          {
            kind: "vocab",
            unit: (lesson.units || []).find((u) => u.type === "vocab"),
            until: Date.now() + durations.vocabMs,
          },
          {
            kind: "speaking",
            unit: (lesson.units || []).find((u) => u.type === "speaking"),
            until: Date.now() + durations.speakingMs,
          },
          {
            kind: "conversation",
            unit: (lesson.units || []).find((u) => u.type === "conversation"),
            until: Date.now() + durations.conversationMs,
          },
        ];

        for (const step of plan) {
          if (!step.unit) continue;
          log(`[unit] ${step.kind} start`);
          if (step.kind === "vocab")
            await runVocab(lesson, step.unit, step.until);
          if (step.kind === "speaking")
            await runSpeaking(lesson, step.unit, step.until);
          if (step.kind === "conversation")
            await runConversation(lesson, step.unit, step.until);
          log(`[unit] ${step.kind} end`);
          await sleep(200);
        }

        realtime.updateInstructions("Keep it short and polite.");
        await realtime.speakOnceAndWait(
          "Great work today. This concludes our mini lesson. See you next time."
        );
        await sleep(durations.wrapMs);
      }

      // --- UI state (unchanged) ---
      function setRunning(on) {
        $("#start").disabled = on ? true : !window.__micReady;
        $("#stop").disabled = !on;
        $("#connect").disabled = on;
        statusEl.textContent = on
          ? "status: running"
          : window.__micReady
          ? "status: ready"
          : "status: idle";
      }

      function loadSample() {
        const sample = {
          lesson: {
            level: "beginner",
            focus: "keigo",
            notes: "Polite phone intros and support lines.",
          },
          units: [
            {
              type: "vocab",
              items: [
                {
                  jp: "お世話になっております",
                  en: "Thank you for your continued support",
                  example_jp: "いつもお世話になっております。",
                },
                {
                  jp: "少々お待ちください",
                  en: "Please wait a moment",
                  example_jp: "少々お待ちくださいませ。",
                },
                {
                  jp: "恐れ入りますが",
                  en: "Excuse me, but / I’m afraid",
                  example_jp: "恐れ入りますが、お名前を頂戴できますか。",
                },
              ],
            },
            {
              type: "speaking",
              items: [
                {
                  jp: "いつもお世話になっております",
                  en: "Thank you as always for your support",
                },
                { jp: "今お時間よろしいでしょうか", en: "Is now a good time?" },
              ],
            },
            {
              type: "conversation",
              turns: [
                {
                  speaker: "bot",
                  jp: "お電話ありがとうございます。株式会社リトルモンスターでございます。",
                },
                {
                  speaker: "user",
                  jp: "○○と申します。いつもお世話になっております。",
                },
                {
                  speaker: "bot",
                  jp: "恐れ入りますが、ご用件をお伺いしてもよろしいでしょうか。",
                },
                { speaker: "user", jp: "少々確認したい点がございます。" },
              ],
            },
          ],
        };
        $("#lesson").value = JSON.stringify(sample, null, 2);
      }

      $("#loadSample").addEventListener("click", loadSample);
      $("#formatJson").addEventListener("click", () => {
        try {
          const obj = JSON.parse($("#lesson").value);
          $("#lesson").value = JSON.stringify(obj, null, 2);
        } catch {
          alert("Invalid JSON");
        }
      });

      $("#connect").addEventListener("click", async () => {
        try {
          const res = await prepareMic({ log });
          mic = res.mic;
          audioEl = res.audioEl;
          window.__micReady = true; // original also set this redundantly
          setRunning(false);
          log("Mic ready (no AI connection yet).");
          $("#start").disabled = false;
        } catch (e) {
          log("Mic prep failed:", e?.message || e);
          alert("Mic prep failed. See console.");
        }
      });

      $("#start").addEventListener("click", async () => {
        let lesson;
        try {
          lesson = JSON.parse($("#lesson").value);
        } catch {
          alert("Invalid lesson JSON");
          return;
        }

        const opts = {
          vocabS: Number($("#vocabS").value || 60),
          speakingS: Number($("#speakS").value || 60),
          conversationS: Number($("#convS").value || 60),
          skipIntro: $("#skipIntro").checked,
          introOnly: $("#introOnly").checked,
        };
        if (opts.skipIntro && opts.introOnly) opts.introOnly = false;

        logEl.textContent = "";
        setRunning(true);
        log("== START LESSON ==");

        try {
          // Mint token only when lesson starts (unchanged behavior)
          const tokResp = await fetch("/realtime/token", { method: "POST" });
          if (!tokResp.ok) throw new Error(await tokResp.text());
          const { value: ek } = await tokResp.json();

          // Create transport + PC logs, like before
          if (!mic || !audioEl) {
            const res = await prepareMic({ log });
            mic = res.mic;
            audioEl = res.audioEl;
          }
          transport = createTransport({
            mediaStream: mic,
            audioElement: audioEl,
          });
          attachPcDebugHandlers({ transport, audioElement: audioEl, log });

          // Start realtime with same initial session.update config
          await realtime.startSession({
            token: ek,
            transport,
            baseInstructions: BASE_EN_POLICY,
            voice: window.INTERVIEW_VOICE || "alloy",
            model: "gpt-4o-mini-transcribe",
          });

          statusEl.textContent = "status: connected";
          log("Realtime session ready (awaiting lesson start).");

          await runLesson(lesson, opts);
          log("== LESSON COMPLETE ==");
        } catch (e) {
          log("Runner error:", e?.message || e);
        } finally {
          setRunning(false);
        }
      });

      $("#stop").addEventListener("click", () => {
        realtime.setArmed(false);
        setArmedPill(false);
        setRunning(false);
        log("== STOPPED BY USER ==");
      });

      // Boot
      window.addEventListener("load", () => {
        loadSample();
        statusEl.textContent = "status: idle";
        armedEl.textContent = "mic: disarmed";
        speakEl.textContent = "tts: idle";
      });
    </script>
  </body>
</html>
